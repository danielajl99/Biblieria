<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/login.css"> <link rel="stylesheet" href="/css/registro.css">
    <title>Registro - Bibliería</title>
    <script src="/javascript/registro.js"></script>
</head>
<body>
    <div class="login-card">
        <h2>Crear Cuenta</h2>
        <form id="registro-form">
            <div class="input-group">
                <label>Nombre Completo</label>
                <input type="text" id="reg-nombre" placeholder="Tu nombre" required>
            </div>
            <div class="input-group">
                <label>Correo Electrónico</label>
                <input type="email" id="reg-email" placeholder="correo@ejemplo.com" required>
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="reg-password" placeholder="••••••••" required>
            </div>
            <div class="input-group">
                <label>Confirmar Contraseña</label>
                <input type="password" id="reg-confirm" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">Registrarse</button>
        </form>
        <div class="footer-links">
            <p>¿Ya tienes cuenta? <a href="login.html" style="color: #ffb74d;">Inicia sesión</a></p>
        </div>
    </div>
</body>
</html>
