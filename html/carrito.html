<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/carrito.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Mi Carrito - Bibliería</title>
    <script src="../javascript/carrito.js"></script>
</head>
<body>
    <div class="background-overlay"></div>

    <main class="container">
        <header class="cart-header">
            <h1><i class="fas fa-shopping-cart"></i> Tu Carrito de Compras</h1>
            <p>Gestiona tus tesoros literarios antes de finalizar.</p>
        </header>
        
        <div class="carrito-wrapper">
            <section class="carrito-items glass-card">
                <table id="tabla-carrito">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Precio</th>
                            <th>Cantidad</th>
                            <th>Subtotal</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="lista-carrito">
                        </tbody>
                </table>
                <a href="/html/catalago.html" class="btn-volver">
                    <i class="fas fa-arrow-left"></i> Continuar Explorando
                </a>
            </section>

            <aside class="resumen-compra glass-card">
                <h3>Resumen de Pedido</h3>
                <div class="resumen-item">
                    <span>Subtotal:</span>
                    <span id="resumen-subtotal">0.00 €</span>
                </div>
                <div class="resumen-item">
                    <span>Gastos de envío:</span>
                    <span class="free">Gratis</span>
                </div>
                <div class="resumen-item">
                    <span>Impuestos (IVA):</span>
                    <span>Incluido</span>
                </div>
                <hr>
                <div class="resumen-item total">
                    <span>Total a pagar:</span>
                    <span id="resumen-total">0.00 €</span>
                </div>
                <button id="btn-finalizar" class="btn-checkout">
                    Confirmar Compra <i class="fas fa-check-circle"></i>
                </button>
            </aside>
        </div>
    </main>
</body>
</html>
